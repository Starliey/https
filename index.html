<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>植物治愈岛 · 一树一码</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #eef3e8;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            padding: 20px 16px 40px;
            color: #1e3a2f;
        }

        /* 主容器 */
        .app-container {
            max-width: 680px;
            margin: 0 auto;
        }

        /* ========= 首页样式（植物列表） ========= */
        .plant-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .page-title {
            font-size: 1.8rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 24px;
            color: #2a6b2f;
            letter-spacing: -0.3px;
        }

        .plant-card-item {
            background: #ffffff;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #ddecd9;
        }

        .plant-card-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.12);
        }

        .plant-img {
            width: 80px;
            height: 80px;
            border-radius: 28px;
            object-fit: cover;
            background: #e9f3e4;
            flex-shrink: 0;
        }

        .plant-info {
            flex: 1;
        }

        .plant-name-list {
            font-size: 1.4rem;
            font-weight: 700;
            color: #4a6e2c;
            margin-bottom: 6px;
        }

        .plant-latin-list {
            font-size: 0.75rem;
            font-style: italic;
            color: #8b9c6e;
            margin-bottom: 6px;
        }

        .plant-desc-list {
            font-size: 0.85rem;
            color: #5f7352;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* ========= 详情页样式（植物档案） ========= */
        .plant-detail {
            background: #ffffff;
            border-radius: 48px 32px 48px 32px;
            overflow: hidden;
            box-shadow: 0 20px 35px -12px rgba(0, 32, 0, 0.15);
            border: 1px solid #d8e6cf;
        }

        .detail-hero {
            background: linear-gradient(135deg, #f9e7b3, #e9d48b);
            padding: 28px 24px 24px;
            text-align: center;
            border-bottom: 1px solid #ecdbaa;
            position: relative;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255,255,240,0.7);
            border: none;
            border-radius: 40px;
            padding: 6px 14px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #7a5a1a;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: 0.2s;
        }

        .back-btn:hover {
            background: #fff2df;
        }

        .detail-plant-name {
            font-size: 2rem;
            font-weight: 700;
            color: #6b4c1a;
            margin-top: 8px;
        }

        .detail-latin {
            font-size: 0.85rem;
            font-style: italic;
            color: #8b6c3a;
        }

        .detail-family {
            display: inline-block;
            background: #fff2df;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.75rem;
            margin-top: 12px;
            color: #9e762e;
        }

        .detail-content {
            padding: 28px 24px;
        }

        /* 专业档案卡片 */
        .pro-card {
            background: #f7fcf3;
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 28px;
            border: 1px solid #deefd4;
        }

        .pro-title {
            font-size: 1rem;
            font-weight: 600;
            color: #43733a;
            border-left: 4px solid #b9d98b;
            padding-left: 12px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pro-item {
            border-bottom: 1px dashed #cfe2c4;
            padding-bottom: 12px;
            margin-bottom: 12px;
        }

        .pro-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .pro-item strong {
            color: #5b7c3e;
            font-weight: 600;
            display: inline-block;
            min-width: 85px;
        }

        .pro-text {
            color: #2c4d27;
            line-height: 1.5;
            margin-top: 6px;
            font-size: 0.92rem;
        }

        /* 情绪寄语 */
        .quote-card {
            background: #fffaf0;
            padding: 20px;
            border-radius: 32px;
            margin-bottom: 28px;
            border: 1px solid #ffe0b5;
        }

        .quote-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #c29b4a;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .quote-text {
            font-size: 1.16rem;
            line-height: 1.48;
            color: #5a3e1b;
        }

        .quote-text::before {
            content: "“";
            font-size: 1.6rem;
            color: #c29b4a;
            margin-right: 4px;
            vertical-align: middle;
        }

        .quote-text::after {
            content: "”";
            font-size: 1.6rem;
            color: #c29b4a;
            margin-left: 4px;
            vertical-align: bottom;
        }

        .audio-box {
            background: #eef5ea;
            border-radius: 44px;
            padding: 16px 20px;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .audio-icon {
            font-size: 1.6rem;
        }

        audio {
            flex: 1;
            min-width: 180px;
            height: 44px;
            border-radius: 40px;
        }

        .course-btn {
            display: block;
            background: #2b7a3e;
            color: white;
            text-align: center;
            font-weight: 600;
            font-size: 1rem;
            padding: 14px 20px;
            border-radius: 60px;
            transition: 0.25s;
            box-shadow: 0 6px 12px -6px rgba(33, 97, 33, 0.3);
            margin-top: 12px;
            border: none;
            cursor: pointer;
            width: 100%;
        }

        .course-note {
            font-size: 0.7rem;
            text-align: center;
            margin-top: 12px;
            color: #6f8f6a;
        }

        .footer-note {
            text-align: center;
            margin-top: 20px;
            font-size: 0.7rem;
            color: #6e8f68;
            border-top: 1px solid #ddecd9;
            padding-top: 20px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
<div class="app-container">
    <!-- 首页：植物列表 -->
    <div id="homeView">
        <h1 class="page-title">🌿 植物治愈岛</h1>
        <div class="plant-list" id="plantListContainer"></div>
        <div class="footer-note" style="margin-top: 30px;">🌸 点击植物卡片，查看专属疗愈档案</div>
    </div>

    <!-- 详情页容器（初始隐藏） -->
    <div id="detailView" class="hidden"></div>
</div>

<script>
    // ---------- 植物数据（包含专业档案、情绪寄语、音频链接等）----------
    const plantsData = [
        {
            id: 1,
            name: "桂花",
            latin: "Osmanthus fragrans Lour.",
            family: "木犀科 · 木犀属",
            img: "https://picsum.photos/id/104/200/150", // 示例图片，建议替换为真实桂花图片
            description: "常绿小乔木，花香浓郁，秋日盛放，是中国传统十大名花之一。",
            // 专业档案条目
            morphology: "常绿灌木或小乔木，高3-5米。叶片革质，椭圆形至长椭圆形，边缘有细锯齿。花簇生叶腋，花冠黄白色，极芳香。",
            ecology: "喜光，稍耐阴，喜温暖湿润气候，不耐水湿，以微酸性沙壤土为佳。花期9-10月。",
            diseases: "常见病害：叶斑病、炭疽病；虫害：红蜘蛛、介壳虫、白粉虱。防治：加强通风，喷洒石硫合剂或吡虫啉。",
            care: "浇水见干见湿，忌积水。秋冬施有机肥，花前增磷钾肥。花后修剪病弱枝，北方冬季需防寒。",
            quote: "你像一树桂花，不必争春，只在深秋悄然吐露芬芳。那些细碎的金黄，藏在叶间，却能让整个季节都变得温柔。即使无人注目，你也静静开花，用香气证明自己的存在。",
            audioUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"  // 示例，请替换为真实录音
        },
        {
            id: 2,
            name: "银杏",
            latin: "Ginkgo biloba L.",
            family: "银杏科 · 银杏属",
            img: "https://picsum.photos/id/13/200/150",
            description: "孑遗植物，扇形叶片秋日金黄，寿命极长，象征坚韧与守望。",
            morphology: "落叶乔木，高达40米。叶片扇形，雌雄异株。种子椭圆形，外种皮肉质，熟时橙黄色。",
            ecology: "喜光，耐寒，深根性，耐干旱，不耐积水。对土壤适应性强，以深厚排水良好土壤为佳。",
            diseases: "主要病害：叶枯病、茎腐病；虫害：银杏大蚕蛾、茶黄蓟马。预防：冬季清园，喷洒波尔多液。",
            care: "幼树需充足水分，成年耐旱。每年秋冬施腐熟有机肥，修剪病弱枝，注意防治蛀干害虫。",
            quote: "你像一棵古老的银杏，不争朝夕，只静静扎根。岁月流转，叶片从翠绿到金黄，每一阶段都是完整的自己。即便世界喧嚣，记得你有向下扎根的力量，和向上生长的从容。",
            audioUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"
        },
        {
            id: 3,
            name: "向日葵",
            latin: "Helianthus annuus",
            family: "菊科 · 向日葵属",
            img: "https://picsum.photos/id/127/200/150",
            description: "花盘随太阳转动，种子可榨油，象征希望与乐观。",
            morphology: "一年生高大草本，茎直立，头状花序巨大，舌状花黄色，管状花褐色。",
            ecology: "喜温暖向阳，耐旱，耐贫瘠，对土壤要求不严。",
            diseases: "常见病害：菌核病、锈病、霜霉病；虫害：蚜虫、棉铃虫。轮作可减轻病害。",
            care: "需充足光照，生长期勤施肥，花蕾期增施磷钾肥。注意排水防涝。",
            quote: "每天都把脸朝向阳光的人，其实内心也有阴天。但即使阴雨连绵，向日葵也在默默积蓄能量，等待下一次日出。偶尔的低落不是后退，是在为更好的绽放蓄力。",
            audioUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"
        },
        {
            id: 4,
            name: "竹子",
            latin: "Bambusoideae",
            family: "禾本科 · 竹亚科",
            img: "https://picsum.photos/id/96/200/150",
            description: "四季青翠，挺拔正直，象征虚心与气节。",
            morphology: "多年生木质化植物，茎节明显，叶片披针形，地下有竹鞭。",
            ecology: "喜温暖湿润，怕积水，部分品种耐寒。生长快速，需充足阳光或半荫。",
            diseases: "常见病害：竹锈病、丛枝病；虫害：竹螟、竹蚜。加强抚育，剪除病枝。",
            care: "保持土壤湿润但勿积水，每年春季施氮肥，及时疏伐老竹，保持通风。",
            quote: "用了四年向下扎根，只为一个春天的拔节。被看见的成长只需要一个瞬间，不被看见的努力才最珍贵。有些路，慢慢走，才能走得更远。",
            audioUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3"
        }
    ];

    // 课程弹窗（共用，园艺方向）
    function showCourseModal() {
        const modal = document.createElement('div');
        modal.style.position = 'fixed';
        modal.style.top = '0';
        modal.style.left = '0';
        modal.style.width = '100%';
        modal.style.height = '100%';
        modal.style.backgroundColor = 'rgba(40,45,30,0.85)';
        modal.style.display = 'flex';
        modal.style.alignItems = 'center';
        modal.style.justifyContent = 'center';
        modal.style.zIndex = '9999';
        modal.style.backdropFilter = 'blur(5px)';
        
        const modalCard = document.createElement('div');
        modalCard.style.backgroundColor = '#fffef5';
        modalCard.style.maxWidth = '340px';
        modalCard.style.width = '85%';
        modalCard.style.borderRadius = '48px';
        modalCard.style.padding = '28px 24px';
        modalCard.style.textAlign = 'center';
        modalCard.style.fontFamily = 'system-ui, sans-serif';
        modalCard.style.boxShadow = '0 25px 40px rgba(0,20,0,0.3)';
        
        modalCard.innerHTML = `
            <div style="font-size:2.4rem;">🌿🪴</div>
            <h3 style="margin: 12px 0 8px; color:#2a5c2e;">家庭园艺必修课</h3>
            <p style="font-size:0.85rem; color:#5b431b; margin-bottom: 20px;">从0到1，学会照顾你的植物</p>
            <div style="background:#f0f7ea; border-radius: 28px; padding: 16px; text-align: left; margin-bottom: 24px;">
                <div style="font-weight:bold; margin-bottom:12px;">📚 课程模块（商业模式演示）</div>
                <ul style="padding-left:20px; color:#2d4a2b; line-height:1.6;">
                    <li>🌱 免费体验课：常见植物浇水与光照指南</li>
                    <li>🐛 9.9元 病虫害识别速成（配实拍图鉴）</li>
                    <li>🧪 29元 家庭有机施肥与土壤改良</li>
                    <li>🛠️ 59元 全系列养护实操课（含修剪、换盆、繁殖）</li>
                    <li>🌟 199元 年卡会员：无限次学习+每周专家答疑</li>
                </ul>
                <p style="margin-top:12px; font-size:0.7rem; background:#fff3d6; padding:6px; border-radius:20px;">📊 转化路径：扫码→试听课→9.9元入门→高阶课/会员</p>
            </div>
            <button id="closeCourseModal" style="background:#2b7a3e; border:none; color:white; padding:10px 28px; border-radius:60px; font-weight:bold; cursor:pointer;"> 关闭 </button>
        `;
        modal.appendChild(modalCard);
        document.body.appendChild(modal);
        
        const closeBtn = modalCard.querySelector('#closeCourseModal');
        const closeModal = () => modal.remove();
        closeBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });
    }

    // 渲染详情页 (基于植物对象)
    function renderDetail(plant) {
        const detailView = document.getElementById('detailView');
        // 构建HTML结构
        detailView.innerHTML = `
            <div class="plant-detail">
                <div class="detail-hero">
                    <button class="back-btn" id="backHomeBtn">← 返回植物园</button>
                    <div class="detail-plant-name">${escapeHtml(plant.name)}</div>
                    <div class="detail-latin">${escapeHtml(plant.latin)}</div>
                    <div class="detail-family">${escapeHtml(plant.family)}</div>
                </div>
                <div class="detail-content">
                    <div class="pro-card">
                        <div class="pro-title"><span>📘</span> 植物专业档案</div>
                        <div class="pro-item"><strong>🌿 形态特征</strong><div class="pro-text">${escapeHtml(plant.morphology)}</div></div>
                        <div class="pro-item"><strong>🌍 生态习性</strong><div class="pro-text">${escapeHtml(plant.ecology)}</div></div>
                        <div class="pro-item"><strong>🐛 常见病虫害</strong><div class="pro-text">${escapeHtml(plant.diseases)}</div></div>
                        <div class="pro-item"><strong>🧑‍🌾 养护要点</strong><div class="pro-text">${escapeHtml(plant.care)}</div></div>
                    </div>
                    <div class="quote-card">
                        <div class="quote-label"><span>🌸</span> 情绪寄语 · 植物悄悄话</div>
                        <div class="quote-text">${escapeHtml(plant.quote)}</div>
                    </div>
                    <div class="audio-box">
                        <div class="audio-icon">🎧</div>
                        <audio controls preload="metadata">
                            <source src="${escapeHtml(plant.audioUrl)}" type="audio/mpeg">
                            您的浏览器不支持音频播放。
                        </audio>
                    </div>
                    <button class="course-btn" id="detailCourseBtn">🌱 进入课程 · 家庭园艺养护与病虫害防治</button>
                    <div class="course-note">✨ 从浇水施肥到病虫害识别，让每一株植物健康生长</div>
                </div>
                <div class="footer-note">🌍 一树一码 · 聆听自然  |  扫码获取专业养护知识</div>
            </div>
        `;
        
        // 绑定返回事件
        const backBtn = document.getElementById('backHomeBtn');
        backBtn.addEventListener('click', () => {
            document.getElementById('homeView').classList.remove('hidden');
            detailView.classList.add('hidden');
            window.scrollTo(0, 0);
        });
        
        // 绑定课程按钮
        const courseBtn = document.getElementById('detailCourseBtn');
        if (courseBtn) {
            courseBtn.addEventListener('click', showCourseModal);
        }
        
        // 显示详情，隐藏首页
        document.getElementById('homeView').classList.add('hidden');
        detailView.classList.remove('hidden');
        window.scrollTo(0, 0);
    }

    // 简单防XSS
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // 渲染首页植物列表
    function renderHome() {
        const container = document.getElementById('plantListContainer');
        container.innerHTML = '';
        plantsData.forEach(plant => {
            const card = document.createElement('div');
            card.className = 'plant-card-item';
            // 使用随机图片占位，但推荐替换实际图片，这里用loremflick? 使用picsum带不同id，可展示不同图
            // 为每种植物的img字段提供默认图，若没有则使用picsum
            const imgSrc = plant.img || `https://picsum.photos/id/${plant.id + 100}/200/150`;
            card.innerHTML = `
                <img class="plant-img" src="${imgSrc}" alt="${plant.name}" loading="lazy">
                <div class="plant-info">
                    <div class="plant-name-list">${escapeHtml(plant.name)}</div>
                    <div class="plant-latin-list">${escapeHtml(plant.latin)}</div>
                    <div class="plant-desc-list">${escapeHtml(plant.description)}</div>
                </div>
            `;
            card.addEventListener('click', () => {
                renderDetail(plant);
            });
            container.appendChild(card);
        });
    }

    // 初始化
    renderHome();
</script>
</body>
</html>
