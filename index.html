<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>植物治愈岛 | 一树一码 · 自然心语</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #eaf7e6;  /* 自然浅绿背景 */
            font-family: system-ui, -apple-system, 'Segoe UI', 'Roboto', 'Noto Sans', sans-serif;
            padding: 20px 16px 40px;
            color: #1e3a2f;
        }

        /* 主卡片 */
        .plant-card {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffffdd;
            backdrop-filter: blur(0px);
            background: #ffffff;
            border-radius: 48px 32px 48px 32px;
            box-shadow: 0 20px 35px -12px rgba(0, 32, 0, 0.2);
            overflow: hidden;
            transition: all 0.2s ease;
            border: 1px solid #cfe3cf;
        }

        /* 植物头部装饰 */
        .hero {
            background: linear-gradient(135deg, #c8e6c9, #a5d6a7);
            padding: 32px 24px 24px;
            text-align: center;
            border-bottom: 1px solid #b9dcb5;
        }

        .plant-name {
            font-size: 2.1rem;
            font-weight: 700;
            color: #1b4d1b;
            letter-spacing: -0.3px;
            margin-bottom: 8px;
        }

        .latin-name {
            font-size: 0.9rem;
            font-style: italic;
            color: #2c5e2c;
            opacity: 0.8;
            font-family: 'Georgia', serif;
        }

        .family-badge {
            display: inline-block;
            background: #f1f8e9;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.8rem;
            margin-top: 12px;
            color: #2e6b2f;
            font-weight: 500;
            box-shadow: inset 0 0 0 1px #c8e0c1;
        }

        /* 内容区域 */
        .content {
            padding: 28px 24px;
        }

        .description {
            background: #f9fef7;
            padding: 18px 20px;
            border-radius: 28px;
            margin-bottom: 28px;
            line-height: 1.55;
            font-size: 1rem;
            color: #2d4a2b;
            border-left: 6px solid #8bc34a;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        /* 情绪寄语卡片 */
        .quote-section {
            background: #fffaf0;
            padding: 20px 20px;
            border-radius: 32px;
            margin-bottom: 28px;
            border: 1px solid #ffe0b5;
            box-shadow: 0 6px 12px -8px rgba(0,0,0,0.05);
        }

        .quote-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #c29b4a;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .quote-label span {
            font-size: 1.2rem;
        }

        .quote-text {
            font-size: 1.24rem;
            line-height: 1.45;
            font-weight: 450;
            color: #5a3e1b;
            font-style: normal;
            quotes: "“" "”" "‘" "’";
        }

        .quote-text::before {
            content: "“";
            font-size: 1.8rem;
            color: #c29b4a;
            margin-right: 4px;
            vertical-align: middle;
        }

        .quote-text::after {
            content: "”";
            font-size: 1.8rem;
            color: #c29b4a;
            margin-left: 4px;
            vertical-align: bottom;
        }

        /* 音频区域 */
        .audio-box {
            background: #eef5ea;
            border-radius: 44px;
            padding: 16px 20px;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .audio-icon {
            font-size: 1.8rem;
        }

        audio {
            flex: 1;
            min-width: 180px;
            height: 44px;
            border-radius: 40px;
            outline: none;
        }

        /* 课程按钮 */
        .course-btn {
            display: block;
            background: #2b7a3e;
            color: white;
            text-align: center;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            padding: 16px 20px;
            border-radius: 60px;
            transition: all 0.25s;
            box-shadow: 0 8px 14px -6px rgba(33, 97, 33, 0.3);
            margin-top: 12px;
            border: none;
            letter-spacing: 1px;
        }

        .course-btn:hover {
            background: #1e5a30;
            transform: scale(0.98);
            box-shadow: 0 4px 8px -4px rgba(0,0,0,0.2);
        }

        .course-note {
            font-size: 0.7rem;
            text-align: center;
            margin-top: 12px;
            color: #6f8f6a;
        }

        /* footer */
        .footer-note {
            text-align: center;
            margin-top: 24px;
            font-size: 0.7rem;
            color: #6e8f68;
            border-top: 1px solid #ddecd9;
            padding-top: 20px;
        }

        /* 加载或错误 */
        .error-message {
            text-align: center;
            padding: 40px 20px;
            color: #b85c1a;
        }

        /* 加载动画小点 */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #528a3b;
        }
    </style>
</head>
<body>
<div class="plant-card" id="plantCard">
    <div class="loading" id="loadingState">🌱 正在读取植物信息 ...</div>
    <div id="plantContent" style="display: none;"></div>
</div>

<script>
    // --------------------------------------------------------------
    // 植物数据库 (可根据需要任意增加修改)
    // 每个植物包含：id, 中文名, 拉丁名, 科属, 简介, 情绪寄语, 音频URL, 课程演示URL
    // 音频文件建议使用自己录制的mp3并托管在 GitHub 仓库 / 或者使用允许外链的云存储
    // 下方示例中使用了占位音频 (在线示例音效，请务必替换成自己的真实录音)
    // 为了演示，这里放置了 Freesound 的公开示例鸣叫/风声，但强烈建议同学们替换为自己的现场录制链接。
    // 注意：实际使用时请将 audioUrl 改为自己上传的音频地址（例如放在 GitHub 仓库中的 /audio/ 文件夹下）
    // --------------------------------------------------------------
    const plantsData = [
        {
            id: 1,
            name: "向日葵",
            latin: "Helianthus annuus",
            family: "菊科 · 向日葵属",
            description: "向日葵因花序随太阳转动而得名，是坚韧与希望的象征。金黄的花盘充满生命力，广泛种植于温带地区。",
            quote: "每天都把脸朝向阳光的人，其实内心也有阴天。但即使阴雨连绵，向日葵也在默默积蓄能量，等待下一次日出。你也一样，偶尔的低落不是后退，是在为更好的绽放蓄力。",
            // 建议替换为你现场录制的风吹叶片声/鸟鸣，长度15~30秒，此处为示例风声音效 (公开协议)
            audioUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",   // 仅作为占位示例，请更换！推荐使用自己录制的mp3链接
            courseUrl: "#demo-course"   // 演示用的锚点，实际可替换为课程介绍页面链接
        },
        {
            id: 2,
            name: "蒲公英",
            latin: "Taraxacum officinale",
            family: "菊科 · 蒲公英属",
            description: "多年生草本，种子带着白色冠毛随风飞翔。蒲公英全株可药用，代表自由与顽强的生命力。",
            quote: "不是所有的种子都选择落地生根，有些选择随风去看看世界。就算目的地未知，乘风飞翔本身，就是一种自由。愿你也拥有随时出发的勇气。",
            audioUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",   // 请替换为自己录制的鸟鸣/风吹声
            courseUrl: "#demo-course"
        },
        {
            id: 3,
            name: "竹子",
            latin: "Bambusoideae",
            family: "禾本科 · 竹亚科",
            description: "四季青翠，挺拔正直，生长迅速。竹子在中国文化中象征虚心、气节与坚韧。",
            quote: "用了四年时间向下扎根，只为一个春天的拔节。被看见的成长只需要一个瞬间，不被看见的努力才最珍贵。有些路，慢慢走，才能走得更远。",
            audioUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",   // 替换为叶片沙沙声或竹林风响
            courseUrl: "#demo-course"
        },
        // 你可以在这里继续增加更多植物，例如：
        // {
        //     id: 4,
        //     name: "薰衣草",
        //     latin: "Lavandula angustifolia",
        //     family: "唇形科 · 薰衣草属",
        //     description: "紫色花穗散发宁静香气，助眠舒缓。",
        //     quote: "安静地释放芬芳，不急不躁。真正的治愈，是温柔地接纳自己的每一面。",
        //     audioUrl: "你的音频链接.mp3",
        //     courseUrl: "课程链接或演示页面"
        // }
    ];

    // 获取 URL 中的 plant 参数，决定展示哪个植物，默认展示第一个（id=1）
    function getPlantIdFromUrl() {
        const urlParams = new URLSearchParams(window.location.search);
        const idParam = urlParams.get('plant');
        if (idParam === null) return 1;
        const plantId = parseInt(idParam, 10);
        return isNaN(plantId) ? 1 : plantId;
    }

    // 根据ID查找植物数据
    function findPlantById(id) {
        return plantsData.find(plant => plant.id === id);
    }

    // 渲染植物信息到页面
    function renderPlant(plant) {
        if (!plant) {
            document.getElementById('loadingState').style.display = 'none';
            const contentDiv = document.getElementById('plantContent');
            contentDiv.style.display = 'block';
            contentDiv.innerHTML = `<div class="error-message">🌿 哎呀，没有找到这棵植物的信息<br>请确认二维码链接是否正确~</div>`;
            return;
        }

        // 隐藏加载，显示内容区域
        document.getElementById('loadingState').style.display = 'none';
        const contentDiv = document.getElementById('plantContent');
        contentDiv.style.display = 'block';

        // 构建完整html（注意课程按钮的链接，如果courseUrl是#demo-course可改为自定义的课程落地页，建议替换）
        // 为了让课程入口在参赛作品中展示商业化设想，我们使用一个简单的弹窗演示或跳转到一个模拟课程页面。
        // 但为了更好的体验，courseUrl 可以设置为一个固定的说明页面（若需要可新建另一个html，但为了便捷，我们做模态演示增强）
        // 按照要求需要“课程入口按钮”，这里我们直接使用链接跳转到一个模拟课程介绍页面，不用真实支付。
        // 为了方便评委查看商业模式，courseUrl将指向一个课程说明区域或者新页面（可以在当前网页增加一个简单课程弹窗）
        // 但用户往往可以直接填写自己的课程落地页URL，这里先做演示，点击显示一个课程卡片模态框。
        // 注意：实际使用时可以修改 courseUrl 为真实的课程介绍地址。
        // 为了让作品完整，点击按钮会打开一个新页面演示课程规划（为了避免空链接，采用模态窗展示课程大纲）
        // 但最初要求只是按钮入口，我们制作一个优雅的提示框演示“课程介绍”并保留真实的跳转选项。

        // 构建最终内容
        const html = `
            <div class="hero">
                <div class="plant-name">${escapeHtml(plant.name)}</div>
                <div class="latin-name">${escapeHtml(plant.latin)}</div>
                <div class="family-badge">${escapeHtml(plant.family)}</div>
            </div>
            <div class="content">
                <div class="description">
                    📖 ${escapeHtml(plant.description)}
                </div>
                <div class="quote-section">
                    <div class="quote-label"><span>🌸</span> 情绪寄语 · 与植物同频</div>
                    <div class="quote-text">${escapeHtml(plant.quote)}</div>
                </div>
                <div class="audio-box">
                    <div class="audio-icon">🎧</div>
                    <audio controls preload="metadata">
                        <source src="${escapeHtml(plant.audioUrl)}" type="audio/mpeg">
                        您的浏览器不支持音频播放，请升级浏览器。
                    </audio>
                </div>
                <a href="javascript:void(0);" class="course-btn" id="demoCourseBtn">📚 进入植物疗愈课程（示例）</a>
                <div class="course-note">✨ 扫码体验 · 课程包含深度自然知识 + 正念音频</div>
            </div>
            <div class="footer-note">
                🌍 一树一码 · 聆听自然  |  扫码认识植物，带走一份治愈
            </div>
        `;
        contentDiv.innerHTML = html;

        // 为课程按钮添加交互：模拟商业变现展示（也可以改成一个真实课程链接）
        const courseBtn = document.getElementById('demoCourseBtn');
        if (courseBtn) {
            courseBtn.addEventListener('click', (e) => {
                e.preventDefault();
                // 因为只是参赛演示，我们创建一个轻提示说明课程商业模式，也可直接跳转至示范课程页面。
                // 但用户后期可以实际替换为真实课程链接，这里提供两种: 显示一个模态窗展示课程大纲示例，符合参赛商业逻辑展示
                showCourseDemo(plant.name);
            });
        }
    }

    // 课程演示弹窗（展现完整课程设计思路，用于评委理解变现模式）
    function showCourseDemo(plantName) {
        // 创建模态框容器
        const modal = document.createElement('div');
        modal.style.position = 'fixed';
        modal.style.top = '0';
        modal.style.left = '0';
        modal.style.width = '100%';
        modal.style.height = '100%';
        modal.style.backgroundColor = 'rgba(30,40,20,0.75)';
        modal.style.display = 'flex';
        modal.style.alignItems = 'center';
        modal.style.justifyContent = 'center';
        modal.style.zIndex = '9999';
        modal.style.backdropFilter = 'blur(4px)';
        
        const modalCard = document.createElement('div');
        modalCard.style.backgroundColor = '#fffef7';
        modalCard.style.maxWidth = '320px';
        modalCard.style.width = '85%';
        modalCard.style.borderRadius = '48px';
        modalCard.style.padding = '28px 24px';
        modalCard.style.boxShadow = '0 25px 40px rgba(0,20,0,0.3)';
        modalCard.style.textAlign = 'center';
        modalCard.style.fontFamily = 'system-ui, sans-serif';
        modalCard.style.position = 'relative';
        
        modalCard.innerHTML = `
            <div style="font-size:2rem;">🌿📖</div>
            <h3 style="margin: 12px 0 8px; color:#2a5c2e;">🌱 植物疗愈学堂 · 课程预览</h3>
            <p style="font-size:0.9rem; color:#3b5c36; margin-bottom: 20px;">基于“${escapeHtml(plantName)}”的自然通感课程</p>
            <div style="background:#f0f7ea; border-radius: 28px; padding: 16px; text-align: left; margin-bottom: 24px;">
                <div style="font-weight:bold; margin-bottom:10px;">🎓 课程模块（示例）</div>
                <ul style="padding-left:20px; color:#2d4a2b; line-height:1.6;">
                    <li>📗 植物识别基础课 (9.9元体验)</li>
                    <li>🎵 自然声音疗愈包 (30分钟原声)</li>
                    <li>🧘 每周情绪正念 · 植物冥想</li>
                    <li>🏞️ 线下植物徒步认领计划</li>
                </ul>
            </div>
            <p style="font-size:0.8rem; color:#8b6b3d;">✨ 本课程为商业模式展示，扫码即可联系项目组</p>
            <button id="closeModalBtn" style="margin-top: 20px; background:#2b7a3e; border:none; color:white; padding:10px 24px; border-radius: 60px; font-weight:bold; cursor:pointer;"> 关闭 </button>
        `;
        
        modal.appendChild(modalCard);
        document.body.appendChild(modal);
        
        const closeBtn = modalCard.querySelector('#closeModalBtn');
        const closeModal = () => modal.remove();
        closeBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });
    }

    // 简单的防XSS转义函数
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }

    // 主入口：加载植物信息
    function init() {
        const plantId = getPlantIdFromUrl();
        const plant = findPlantById(plantId);
        renderPlant(plant);
        // 如果植物不存在，renderPlant会展示错误
    }

    // 启动
    init();
</script>
</body>
</html>
